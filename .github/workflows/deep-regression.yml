name: KICC Deep Regression TÜV
# KICC-CI-HAERTUNG (14.11.2026, Lieferketten-Angriff „wfx“): Bausteine auf geprüfte Commits festgeschrieben (KC-ACTIONS-FEST),
# npm ohne Paket-Skripte (--ignore-scripts), Checkout ohne gespeichertes Token. Siehe docs/SECURITY.md „Lieferkette & CI“.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - name: Install test tools
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run exactly 50 Chromium regression tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kicc-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces screenshots videos
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kicc-playwright-failures
          path: test-results/
          retention-days: 14
