name: KICC Deep Regression TÜV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  deep-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - name: Install test tools
        run: npm install

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: ESLint
        run: npm run lint

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Chromium regression · exactly 50 tests
        run: npm run test:e2e

      - name: Cross-browser regression · Chromium Firefox WebKit
        run: npm run test:cross-browser

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicc-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces screenshots videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kicc-playwright-failures
          path: test-results/
          retention-days: 14
